# Builds the fridge page and publishes it to GitHub Pages.
# Calendar and weather come live from the Google script, so there is no schedule here (and no
# 60-day "inactive repo" shutoff to worry about). Runs on every push to main, or by hand:
# Actions tab → "Deploy to Pages" → Run workflow.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Encrypt the fridge config (skipped until the secrets exist)
        run: npm run encrypt-config
        env:
          DASH_CONFIG: ${{ secrets.DASH_CONFIG }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
      - name: Check the encrypted config opens
        if: ${{ hashFiles('dist/config.enc.json') != '' }}
        run: npm run decrypt-check
        env:
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
      - name: Tests, including the guard that nothing readable is published
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
